name: Build custom L2TP VPN APK
'on':
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Validate Android manifest XML
        run: |
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          path = "app/src/main/AndroidManifest.xml"
          try:
              ET.parse(path)
              print(f"XML OK: {path}")
          except ET.ParseError as exc:
              raise SystemExit(f"Invalid XML in {path}: {exc}")
          PYXML
      - name: Compile Kotlin sources
        run: /tmp/gradle-8.9/bin/gradle --no-daemon :app:compileDebugKotlin
      - name: Run protocol unit tests
        run: /tmp/gradle-8.9/bin/gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MohsenL2TP-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
